<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>SakayNa — Welcome</title>
  <style>
    :root {
      --green: #39c74d;
      --green-dark: #28ad3e;
      --ink: #171b20;
      --muted: #898b8e;
      --cream: #fbfaf7;
      --skyline-dark: #555a60;
      --skyline-mid: #94999d;
      --skyline-light: #e6e5e2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      background: #e7eee9;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* The shell is just for presentation on a computer.
       On an actual Android screen the app is edge-to-edge. */
    .phone {
      position: relative;
      width: min(100%, 414px);
      height: min(900px, 100dvh);
      min-height: 760px;
      overflow: hidden;
      background: white;
      border: 10px solid #191c1f;
      border-radius: 48px;
      box-shadow: 0 18px 60px rgba(0,0,0,.2);
    }
    .screen {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #fff;
      border-radius: 36px;
    }
    .status-bar {
      flex: 0 0 49px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -.4px;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; height: 19px; }
    .signal { display: flex; align-items: end; gap: 2px; height: 15px; }
    .signal i { width: 3px; background: var(--ink); border-radius: 2px; }
    .signal i:nth-child(1) { height: 5px; }
    .signal i:nth-child(2) { height: 8px; }
    .signal i:nth-child(3) { height: 11px; }
    .signal i:nth-child(4) { height: 14px; }
    .wifi { width: 17px; height: 13px; border: 3px solid var(--ink); border-left-color: transparent; border-bottom-color: transparent; border-right-color: transparent; border-radius: 50%; position: relative; margin-top: 6px; }
    .wifi::after { content: ""; position: absolute; top: 5px; left: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
    .battery { position: relative; width: 23px; height: 12px; border: 2px solid var(--ink); border-radius: 3px; padding: 2px; }
    .battery::before { content: ""; display: block; width: 100%; height: 100%; background: var(--ink); border-radius: 1px; }
    .battery::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: var(--ink); border-radius: 0 2px 2px 0; }

    .brand {
      flex: 0 0 auto;
      padding-top: 41px;
      text-align: center;
      position: relative;
      z-index: 8;
    }
    .brand-symbol { position: relative; width: 116px; height: 104px; margin: 0 auto 3px; }
    .speed-line { position: absolute; height: 7px; background: var(--green); border-radius: 999px; left: 3px; }
    .speed-line.one { width: 26px; top: 46px; }
    .speed-line.two { width: 34px; top: 64px; left: 15px; }
    .pin-logo {
      position: absolute;
      top: 5px; right: 16px;
      height: 75px; width: 75px;
      background: var(--green);
      border-radius: 50% 50% 50% 5%;
      transform: rotate(-45deg);
    }
    .logo-van {
      position: absolute;
      left: 16px; top: 14px;
      width: 46px; height: 42px;
      transform: rotate(45deg);
      background: white;
      border-radius: 8px 8px 7px 7px;
    }
    .logo-van::before { content: ""; position: absolute; left: 7px; top: 7px; width: 32px; height: 20px; background: #1a2026; border-radius: 3px; }
    .logo-van::after { content: ""; position: absolute; left: 6px; bottom: -5px; width: 8px; height: 9px; border-radius: 0 0 4px 4px; background: #1a2026; box-shadow: 27px 0 #1a2026; }
    .headlight { position: absolute; bottom: 8px; left: 7px; height: 5px; width: 5px; background: var(--green); border-radius: 50%; box-shadow: 27px 0 var(--green); z-index: 1; }
    .brand-name { margin: 0; font-weight: 800; font-size: clamp(49px, 13.5vw, 63px); line-height: 1.05; letter-spacing: -3.5px; }
    .brand-name strong { color: var(--green); font-weight: inherit; }

    .scene { flex: 1 1 auto; position: relative; min-height: 306px; margin-top: 16px; overflow: hidden; }
    .cloud { position: absolute; background: #eceeed; width: 50px; height: 15px; border-radius: 50px; z-index: 1; opacity: .95; }
    .cloud::before, .cloud::after { content: ""; position: absolute; bottom: 3px; background: inherit; border-radius: 50%; }
    .cloud::before { width: 25px; height: 24px; left: 9px; }
    .cloud::after { width: 19px; height: 18px; left: 27px; }
    .cloud.c1 { left: 11%; top: 29%; transform: scale(.9); }
    .cloud.c2 { right: 15%; top: 14%; transform: scale(1.1); }
    .cloud.c3 { left: 71%; top: 39%; transform: scale(.65); }
    .earth {
      z-index: 1;
      position: absolute;
      width: 112%; aspect-ratio: 1;
      left: -6%; bottom: -252px;
      background: #f9f8f4;
      border-radius: 50%;
      overflow: hidden;
    }
    .land { background: var(--green); position: absolute; }
    .land.l1 { left: -9%; top: 6%; width: 60%; height: 72%; clip-path: polygon(18% 11%, 45% 0, 63% 7%, 65% 19%, 79% 27%, 64% 37%, 76% 56%, 62% 59%, 57% 79%, 43% 68%, 36% 93%, 21% 76%, 9% 55%, 0 32%); }
    .land.l2 { left: 45%; top: 1%; width: 51%; height: 68%; clip-path: polygon(5% 19%, 29% 6%, 47% 12%, 59% 0, 83% 16%, 94% 31%, 77% 43%, 86% 59%, 67% 65%, 55% 86%, 35% 74%, 28% 51%, 7% 42%); }
    .land.l3 { right: -17%; top: 30%; width: 49%; height: 55%; clip-path: polygon(0 12%, 40% 0, 61% 14%, 51% 37%, 96% 53%, 72% 74%, 28% 94%, 10% 65%); }
    .land.l4 { left: 22%; top: 74%; width: 32%; height: 26%; clip-path: polygon(0 17%, 36% 0, 78% 17%, 100% 70%, 49% 100%, 11% 74%); }
    .land.l5 { left: 66%; top: 80%; width: 12%; height: 12%; border-radius: 45% 50% 40% 42%; transform: rotate(25deg); }
    .city { position: absolute; bottom: 86px; left: 6%; width: 88%; height: 243px; z-index: 2; }
    .building { position: absolute; bottom: 0; left: var(--x); width: var(--w); height: var(--h); border-radius: 2px 2px 0 0; transform: rotate(var(--r)); transform-origin: bottom center; background: var(--color); overflow: hidden; }
    .building::before { content: ""; position: absolute; inset: 10px 6px 6px; background: repeating-linear-gradient(to right, transparent 0 8px, rgba(255,255,255,.60) 8px 11px, transparent 11px 16px); opacity: .82; }
    .building.dark::before { background: repeating-linear-gradient(to bottom, transparent 0 8px, rgba(232,233,232,.7) 8px 11px, transparent 11px 15px); }
    .building.tall::after { content: ""; position: absolute; height: 34px; width: 2px; left: 50%; top: -31px; background: #dedbd7; }
    .tree { position: absolute; bottom: 0; width: 3px; height: 34px; background: #474c51; z-index: 3; }
    .tree::before { content: ""; position: absolute; bottom: 14px; left: -12px; height: 28px; width: 26px; background: #777d80; clip-path: ellipse(42% 50% at 50% 50%); }
    .tree.t1 { left: 17%; } .tree.t2 { left: 88%; }
    .city-pin { position: absolute; z-index: 3; width: 21px; height: 21px; background: var(--green); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    .city-pin::after { content: ""; position: absolute; width: 8px; height: 8px; left: 6.5px; top: 6.5px; background: #fff; border-radius: 50%; }
    .city-pin.p1 { left: 12%; top: 41%; } .city-pin.p2 { left: 31%; top: 12%; } .city-pin.p3 { left: 73%; top: 25%; } .city-pin.p4 { right: 10%; top: 49%; }
    .road {
      position: absolute; z-index: 4;
      left: -8%; width: 116%; height: 95px;
      bottom: 65px;
      border-top: 5px solid #262c31;
      border-radius: 50% 50% 0 0 / 80% 80% 0 0;
      pointer-events: none;
    }
    .van { position: absolute; z-index: 5; width: 163px; height: 73px; left: 49%; bottom: 142px; transform: translateX(-50%); }
    .van-body { position: absolute; left: 0; bottom: 13px; height: 54px; width: 155px; background: #fff; border: 2px solid #e4e5e3; border-radius: 13px 25px 11px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.1); overflow: hidden; }
    .van-body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 11px; height: 3px; background: var(--green); }
    .van-window { position: absolute; z-index: 2; top: 11px; height: 24px; background: #24292f; border-radius: 3px; }
    .van-window.w1 { left: 13px; width: 31px; } .van-window.w2 { left: 48px; width: 31px; } .van-window.w3 { left: 83px; width: 30px; }
    .van-window.front { left: 117px; width: 26px; border-radius: 2px 11px 3px 3px; transform: skewX(11deg); }
    .van-wheel { position: absolute; z-index: 3; bottom: 4px; width: 22px; height: 22px; border-radius: 50%; background: #292e32; border: 6px solid #efefec; box-shadow: 0 0 0 3px #292e32; }
    .van-wheel.rear { left: 23px; } .van-wheel.front { right: 18px; }
    .motion { position: absolute; z-index: 2; height: 3px; background: #9b9fa1; border-radius: 10px; right: 100%; }
    .motion.m1 { top: 35px; width: 24px; margin-right: 6px; } .motion.m2 { top: 44px; width: 15px; margin-right: 11px; }

    .sheet {
      position: relative; z-index: 10; flex: 0 0 264px;
      display: flex; flex-direction: column; align-items: center;
      width: 100%; background: var(--cream);
      padding: 25px 23px 24px;
      border-radius: 38px 38px 0 0;
      box-shadow: 0 -3px 18px rgba(0,0,0,.018);
      text-align: center;
    }
    .sheet h2 { font-size: 26px; letter-spacing: -.75px; line-height: 1.14; font-weight: 800; margin: 7px 0 11px; }
    .sheet p { color: var(--muted); font-size: 14px; line-height: 1.48; margin: 0 0 auto; max-width: 315px; }
    .start {
      width: 100%; height: 52px; border: none;
      color: var(--ink); background: var(--green);
      font: inherit; font-size: 18px; font-weight: 800;
      border-radius: 999px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 16px;
      transition: background .2s ease, transform .2s ease;
    }
    .start:hover { background: var(--green-dark); }
    .start:active { transform: scale(.985); }
    .start:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .start .arrow { font-size: 30px; line-height: .5; font-weight: 400; margin-top: -3px; }
    .dots { display: flex; justify-content: center; gap: 10px; margin-top: 21px; }
    .dot { width: 10px; height: 10px; background: #dedfe0; border-radius: 50%; }
    .dot.active { background: var(--green); }

    @media (max-width: 500px) {
      body { background: white; }
      .phone { width: 100%; height: 100dvh; min-height: 690px; border: none; border-radius: 0; box-shadow: none; }
      .screen { border-radius: 0; }
    }
    @media (max-height: 780px) {
      .brand { padding-top: 15px; }
      .brand-symbol { transform: scale(.83); margin-bottom: -8px; }
      .brand-name { font-size: 52px; }
      .scene { min-height: 260px; margin-top: 0; }
      .sheet { flex-basis: 251px; padding-top: 18px; }
      .sheet h2 { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { .start { transition: none; } }
  </style>
</head>
<body>
  <div class="phone">
    <main class="screen">
      <!-- This faux status bar is only for the design preview. -->
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span>
      </div>

      <header class="brand" aria-label="SakayNa">
        <div class="brand-symbol" aria-hidden="true">
          <span class="speed-line one"></span><span class="speed-line two"></span>
          <span class="pin-logo"><span class="logo-van"><span class="headlight"></span></span></span>
        </div>
        <h1 class="brand-name">Sakay<strong>Na</strong></h1>
      </header>

      <section class="scene" aria-label="Illustration of a van driving through a city around a green globe">
        <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
        <div class="earth" aria-hidden="true">
          <span class="land l1"></span><span class="land l2"></span><span class="land l3"></span><span class="land l4"></span><span class="land l5"></span>
        </div>
        <div class="city" aria-hidden="true">
          <span class="building dark" style="--x:1%;--w:36px;--h:70px;--r:-25deg;--color:#62676b"></span>
          <span class="building" style="--x:9%;--w:43px;--h:117px;--r:-23deg;--color:#e7e5e2"></span>
          <span class="building dark" style="--x:18%;--w:38px;--h:137px;--r:-17deg;--color:#5f6469"></span>
          <span class="building" style="--x:27%;--w:39px;--h:157px;--r:-12deg;--color:#d8dad9"></span>
          <span class="building dark" style="--x:34%;--w:38px;--h:179px;--r:-9deg;--color:#797c7e"></span>
          <span class="building" style="--x:44%;--w:47px;--h:235px;--r:0deg;--color:#868b8f"></span>
          <span class="building" style="--x:56%;--w:38px;--h:157px;--r:3deg;--color:#e5e3df"></span>
          <span class="building" style="--x:65%;--w:31px;--h:124px;--r:10deg;--color:#dededc"></span>
          <span class="building dark" style="--x:76%;--w:39px;--h:169px;--r:16deg;--color:#696e72"></span>
          <span class="building" style="--x:84%;--w:40px;--h:117px;--r:22deg;--color:#e3e2df"></span>
          <span class="building dark" style="--x:94%;--w:32px;--h:64px;--r:26deg;--color:#8f9496"></span>
          <span class="tree t1"></span><span class="tree t2"></span>
        </div>
        <span class="city-pin p1"></span><span class="city-pin p2"></span><span class="city-pin p3"></span><span class="city-pin p4"></span>
        <div class="road" aria-hidden="true"></div>
        <div class="van" aria-hidden="true">
          <span class="motion m1"></span><span class="motion m2"></span>
          <div class="van-body">
            <span class="van-window w1"></span><span class="van-window w2"></span><span class="van-window w3"></span><span class="van-window front"></span>
          </div>
          <span class="van-wheel rear"></span><span class="van-wheel front"></span>
        </div>
      </section>

      <section class="sheet">
        <h2>Your Ride,<br>A Brighter Tomorrow</h2>
        <p>SakayNa connects you to places,<br>people, and new opportunities.</p>
        <button class="start" type="button">
          Get Started <span class="arrow" aria-hidden="true">→</span>
        </button>
        <div class="dots" aria-label="Onboarding page 1 of 3">
          <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
